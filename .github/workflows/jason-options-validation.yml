name: Jason Options Engine 500 Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/jason_options_engine_v1.py'
      - 'research/test_jason_options_engine_v1.py'
      - 'backend_api_python/scripts/validate_jason_options_500.py'
      - 'data/jason_options_pit/**'
      - 'data/jason_options_validation/**'
      - '.github/workflows/jason-options-validation.yml'
  push:
    branches: [main]
    paths:
      - 'research/jason_options_engine_v1.py'
      - 'research/test_jason_options_engine_v1.py'
      - 'backend_api_python/scripts/validate_jason_options_500.py'
      - 'data/jason_options_pit/**'
      - 'data/jason_options_validation/**'
      - '.github/workflows/jason-options-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'pyarrow>=17,<22' 'pytest>=8,<9'
      - name: Compile
        run: python -m py_compile research/jason_options_engine_v1.py backend_api_python/scripts/validate_jason_options_500.py
      - name: Unit tests
        env:
          PYTHONPATH: research
        run: python -m pytest -q research/test_jason_options_engine_v1.py
      - name: Run fail-closed formal gate
        run: python backend_api_python/scripts/validate_jason_options_500.py
      - name: Verify safety boundary
        run: |
          test -s QUANTDINGER_JASON_OPTIONS_500_RESULT.json
          test -s QUANTDINGER_JASON_OPTIONS_500_REPORT.md
          python - <<'PY'
          import json
          x=json.load(open('QUANTDINGER_JASON_OPTIONS_500_RESULT.json'))
          assert x['synthetic_allowed'] is False
          assert x['broker_connected'] is False and x['live_orders'] is False
          assert x['margin'] is False and x['leverage'] is False
          if x['qualification'] != 'PASS':
              assert x['trade_decision'] == 'NO_TRADE'
              assert x['today'] == '暂无A级交易机会'
              assert x['multi_engine_status'] == '未完成多引擎验证'
          PY
